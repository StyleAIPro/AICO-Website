<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">DSH Terminal 安装操作示意</title><desc id="desc">第一步打开 Windows 托盘，第二步选择 DSH Terminal，第三步粘贴安装命令并按回车。</desc><rect width="1200" height="460" rx="20" fill="#eeeae1"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="44" y="58" font-size="26" fill="#27271f">在原版 Desktop 中打开终端</text><text x="1040" y="55" font-size="18" fill="#71664b">操作示意</text><rect x="40" y="90" width="310" height="312" rx="12" fill="#fffdf8"/><text x="65" y="132" font-size="22" fill="#625437">01  Windows 右下角托盘</text><rect x="65" y="178" width="258" height="140" rx="9" fill="#242826"/><text x="91" y="226" font-size="21" fill="white">∧     DSH Desktop</text><text x="91" y="275" font-size="18" fill="#dbd6c8">找到图标，打开菜单</text><text x="65" y="368" font-size="17" fill="#686052">图标也可能收在 ∧ 里面</text><rect x="370" y="90" width="300" height="312" rx="12" fill="#fffdf8"/><text x="395" y="132" font-size="22" fill="#625437">02  选择终端</text><rect x="395" y="178" width="250" height="140" rx="9" fill="#f0ede6"/><text x="415" y="216" font-size="19" fill="#555">DSH Desktop 托盘菜单</text><rect x="406" y="237" width="228" height="58" rx="7" fill="#655738"/><text x="424" y="274" font-size="23" fill="white">DSH Terminal</text><text x="395" y="368" font-size="17" fill="#686052">使用要安装插件的 Profile</text><rect x="690" y="90" width="470" height="312" rx="12" fill="#fffdf8"/><text x="715" y="132" font-size="22" fill="#625437">03  粘贴安装命令，按 Enter</text><rect x="715" y="178" width="420" height="140" rx="9" fill="#20251f"/><text x="736" y="214" font-size="17" fill="#d1c6a9">DSH Terminal</text><text x="736" y="251" font-family="monospace" font-size="18" fill="#fff">&gt; dsh plugin add "…\插件包.tgz"</text><text x="755" y="280" font-family="monospace" font-size="18" fill="#fff">--ignore-scripts</text><text x="715" y="350" font-size="17" fill="#686052">示意换行；复制卡片中的完整单行命令。</text><text x="715" y="377" font-size="17" fill="#686052">安装成功后保存工作并重启 Desktop。</text></g></svg>
